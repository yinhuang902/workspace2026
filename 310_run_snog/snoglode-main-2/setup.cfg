[metadata]
name = snoglode
version = 0.1.0
author = Georgia Stinchfield
author_email = gstinchf@andrew.cmu.edu
description = Structured Nonlinear Global Decomposition Framework
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/gcstinchfield/snoglode
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.8
install_requires =
    numpy
    pyomo
