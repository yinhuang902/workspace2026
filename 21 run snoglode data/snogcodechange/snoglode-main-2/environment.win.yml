name: snoglode-ori
channels:
  - conda-forge
  - defaults
dependencies:
  # ---- base ----
  - python=3.11
  - pip
  - setuptools
  - wheel

  # ---- jupyter / dev ----
  - ipython
  - ipykernel
  - jupyter_client
  - jupyter_core
  - pyzmq
  - tornado
  - traitlets
  - debugpy

  # ---- scientific ----
  - numpy
  - scipy
  - pandas
  - matplotlib
  - sympy
  - networkx
  - psutil

  # ---- MPI (Windows) ----
  - msmpi
  - mpi4py


  # ---- optimization modeling ----
  - pyomo

  # NOTE: ipopt/mumps 在 Windows conda 上经常不稳定/不可用。
  #       建议先不在这里强行装，后面如果必须用 ipopt 再单独处理（或用 WSL/Linux）。

  - pip:
      - build==1.2.2
      - certifi==2024.2.2
      - charset-normalizer==3.3.2
      - click==8.1.8
      - contourpy==1.1.0
      - cycler==0.11.0
      - deepdiff==6.7.1
      - et-xmlfile==1.1.0
      - flexcache==0.3
      - flexparser==0.4
      - fonttools==4.42.1
      - gurobipy==11.0.0
      - idaes-pse==2.7.0
      - idna==3.6
      - iniconfig==2.0.0
      - kiwisolver==1.4.5
      - matplotlib==3.7.2
      - mpmath==1.3.0
      - networkx==3.4.2
      - numpy==1.25.2
      - ordered-set==4.1.0
      - packaging==23.1
      - pandas==2.2.1
      - pillow==10.0.0
      - pint==0.24.4
      - pluggy==1.4.0
      - ply==3.11
      - pyomo==6.8.2
      - pyparsing==3.0.9
      - pyproject-hooks==1.2.0
      - pytest==8.0.1
      - pytz==2024.1
      - sortedcontainers==2.4.0
      - sympy==1.13.3
      - tzdata==2024.1
      - urllib3==2.2.1

